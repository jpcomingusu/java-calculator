<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      margin: 0;
      padding: 40px 20px;
    }
    .wrapper {
      max-width: 420px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 24px;
    }
    h3 {
      margin-top: 0;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      margin: 6px 4px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
    }
    button:hover {
      background: #1d4ed8;
    }
    .answer {
      margin-top: 18px;
      font-size: 1.1rem;
    }
    .back {
      display: inline-block;
      margin-bottom: 16px;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
  <script>
    function add() {
      let a = document.getElementById("fn").value;
      let b = document.getElementById("sn").value;
      let c = Number(a) + Number(b);
      document.getElementById("ans").innerHTML = c;
    }

    function sub() {
      let a = document.getElementById("fn").value;
      let b = document.getElementById("sn").value;
      let c = Number(a) - Number(b);
      document.getElementById("ans").innerHTML = c;
    }

    function mult() {
      let a = document.getElementById("fn").value;
      let b = document.getElementById("sn").value;
      let c = Number(a) * Number(b);
      document.getElementById("ans").innerHTML = c;
    }

    function div() {
      let a = document.getElementById("fn").value;
      let b = document.getElementById("sn").value;
      let c = Number(a) / Number(b);
      document.getElementById("ans").innerHTML = c;
    }

    function exp() {
      let a = document.getElementById("fn").value;
      let b = document.getElementById("sn").value;
      let c = Number(a) ** Number(b);
      document.getElementById("ans").innerHTML = c;
    }
  </script>
</head>
<body>
  <div class="wrapper">
    <a href="../" class="back">← Back to home</a>
    <h3>Simple Calculator Using JavaScript!</h3>

    <p>First number? <input id="fn" type="number" /></p>
    <p>Second number? <input id="sn" type="number" /></p>

    <div>
      <button onclick="add()"> + </button>
      <button onclick="sub()"> - </button>
      <button onclick="mult()"> · </button>
      <button onclick="div()"> ÷ </button>
      <button onclick="exp()"> x² </button>
    </div>

    <p class="answer">Your answer is <span id="ans"> ____________ </span></p>
  </div>
</body>
</html>
