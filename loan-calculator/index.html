<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Calculator Functions</title>

  <script>
   function calculateMonthlyPayment() {
    
    let PV = document.getElementById("PV").value
  let n = document.getElementById("n").value
  let r = document.getElementById("r").value
     
 let P = ((r/100/12) * PV) / (1-(1+(r/100/12))**-(n*12));   
 document.getElementById("ans").innerHTML= "If you take a loan for $" + PV + "for" + n + "years at " + r + "%, your payment would be $" + P.toFixed(2);
}


    
</script>
  
  
</head>
<body>
  <h3>Loan Payment Calculator</h3>

<p> Present Value (the amount you wish to borrow) <input id="PV"> <br>
  Years <input id="n"> <br>
  % - Annual Interest Rate <input id="r"> <br>
<button onclick="calculateMonthlyPayment()"> Calculate Monthly Payment </button>

  
</p>
<p>
  Your answer is <span id="ans"> ____________ </span></p>  
  

  
</body>
</html>
