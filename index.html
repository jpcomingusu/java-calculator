<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Java Calculator Collection</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff 0%, #f8fbff 100%);
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: min(900px, 90vw);
      text-align: center;
      background: rgba(255,255,255,0.85);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(31, 41, 55, 0.12);
      padding: 48px 24px;
    }
    h1 {
      margin-top: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      color: #0f172a;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 28px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: #111827;
      background: #ffffff;
      border: 2px solid #dbeafe;
      border-radius: 16px;
      padding: 28px 18px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.08);
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #60a5fa;
      box-shadow: 0 12px 28px rgba(59, 130, 246, 0.12);
    }
    .card h2 {
      margin: 0;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Java Calculator Collection</h1>
    <p>Choose a calculator page below.</p>
    <div class="cards">
      <a class="card" href="./basic-calculator/">
        <h2>Basic Calculator</h2>
      </a>
      <a class="card" href="./loan-calculator/">
        <h2>Loan Calculator</h2>
      </a>
    </div>
  </div>
</body>
</html>
